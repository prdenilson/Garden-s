
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Garden's</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: #d4af37;
            font-family: Georgia, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        h1 {
            font-size: 34px;
            letter-spacing: 3px;
        }

        .subtitulo {
            color: #fff;
            margin-bottom: 30px;
        }

        #roleta {
            width: 300px;
            height: 300px;
            border: 8px solid #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
            box-shadow: 0 0 30px #80651c;
            font-size: 65px;
            font-weight: bold;
        }

        button {
            margin-top: 35px;
            padding: 18px 45px;
            background: #d4af37;
            color: #111;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #resultado {
            margin-top: 30px;
            color: white;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <h1>GARDEN'S</h1>

    <p class="subtitulo">SORTEIO OFICIAL</p>

    <div id="roleta">?</div>

    <button id="sortear">REALIZAR SORTEIO</button>

    <div id="resultado"></div>

</body>
</html>
