<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garden's | Área de Sorteio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #090909;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    margin: 20px 0 30px;
}

header h1 {
    color: #d4af61;
    letter-spacing: 4px;
    font-size: 30px;
}

header p {
    color: #aaa;
    letter-spacing: 2px;
    font-size: 12px;
}

#login {
    max-width: 380px;
    margin: 60px auto;
    padding: 25px;
    background: #171717;
    border: 1px solid #b89548;
    border-radius: 12px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    background: #090909;
    border: 1px solid #555;
    border-radius: 6px;
    color: white;
}

button {
    cursor: pointer;
}

#entrar {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    background: #d4af61;
    color: #111;
    border: none;
    border-radius: 6px;
    font-weight: bold;
}

#painel {
    display: none;
    max-width: 650px;
    margin: auto;
}

.aviso {
    color: #d4af61;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.grade {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 460px;
    margin: auto;
}

.numero {
    display: flex;
    justify-content: center;
    align-items: center;
    aspect-ratio: 1 / 1;
    min-width: 0;
    background: #202020;
    border: 1px solid #454545;
    border-radius: 6px;
    color: #eee;
    font-size: clamp(11px, 2.5vw, 17px);
    font-weight: bold;
    transition: background 0.08s, box-shadow 0.08s;
}

.numero.aceso {
    background: #d4af61;
    color: #111;
    border: 2px solid #fff0b0;
    box-shadow: 0 0 12px #d4af61, 0 0 25px #d4af61;
    transform: scale(1.05);
}

.numero.vencedor {
    background: #f5d77d;
    color: #000;
    border: 3px solid white;
    box-shadow: 0 0 20px #f5d77d, 0 0 45px #d4af61;
    transform: scale(1.12);
}

#iniciar {
    margin-top: 30px;
    padding: 16px 30px;
    background: linear-gradient(135deg, #e4c477, #a77b28);
    color: #111;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
}

#iniciar:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#resultado {
    min-height: 145px;
    margin: 30px auto;
    padding: 20px;
}

#resultado h2 {
    color: #d4af61;
    font-size: 17px;
}

#numeroFinal {
    display: block;
    color: #f5d77d;
    font-size: 65px;
    font-weight: bold;
    margin-top: 10px;
    text-shadow: 0 0 20px #d4af61;
}

#nomeVencedor {
    display: block;
    margin-top: 15px;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
}

#mensagemResultado {
    color: #d4af61;
    font-size: 13px;
    margin-top: 12px;
}

#sair {
    margin: 20px;
    padding: 10px 20px;
    color: #ddd;
    background: transparent;
    border: 1px solid #777;
    border-radius: 6px;
}

footer {
    margin-top: 40px;
    color: #777;
    font-size: 12px;
}

@media (max-width: 400px) {
    body {
        padding: 12px;
    }

    .grade {
        gap: 6px;
    }
}

</style>
</head>

<body>

<header>
    <h1>GARDEN'S</h1>
    <p>ÁREA DE SORTEIO</p>
</header>

<section id="login">

    <h2 style="color:#d4af61;">
        ACESSO RESTRITO
    </h2>

    <p style="color:#aaa;font-size:13px;">
        Área exclusiva do administrador.
    </p>

    <input
        type="email"
        id="email"
        placeholder="E-mail"
        autocomplete="username"
    >

    <input
        type="password"
        id="senha"
        placeholder="Senha"
        autocomplete="current-password"
    >

    <button id="entrar" onclick="fazerLogin()">
        ENTRAR
    </button>

    <p id="mensagemLogin" style="color:#d4af61;"></p>

</section>


<main id="painel">

    <div class="aviso">
        TESTE DE INTEGRAÇÃO COM SUPABASE
    </div>

    <h2 style="color:#fff;">
        SORTEIO GARDEN'S
    </h2>

    <p style="color:#aaa;font-size:13px;">
        Acompanhe os números iluminados.
    </p>

    <div class="grade" id="grade"></div>

    <button id="iniciar" onclick="iniciarTeste()">
        INICIAR TESTE
    </button>

    <section id="resultado">

        <h2 id="textoResultado">
            AGUARDANDO TESTE
        </h2>

        <span id="numeroFinal">--</span>

        <span id="nomeVencedor"></span>

        <p id="mensagemResultado"></p>

    </section>

    <button id="sair" onclick="sair()">
        SAIR DO ACESSO RESTRITO
    </button>

</main>


<footer>
    © 2026 Garden's Loja — Todos os direitos reservados.
</footer>


<script>

// CONFIGURAÇÃO DO SUPABASE

const SUPABASE_URL =
"https://kiefyoedeervkrtrkghj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4jnOI6Pnkjqe-D-ygXnQzw_sF7lpCr1";

const UID_ADMIN =
"468b21fd-98d8-47c8-b48c-dc849207c858";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ELEMENTOS DA PÁGINA

const login = document.getElementById("login");
const painel = document.getElementById("painel");
const grade = document.getElementById("grade");


// CRIAR OS 50 NÚMEROS

for (let i = 1; i <= 50; i++) {

    const elemento = document.createElement("div");

    elemento.className = "numero";

    elemento.id = "numero-" + i;

    elemento.textContent =
        String(i).padStart(2, "0");

    grade.appendChild(elemento);
}


// VERIFICAR ACESSO ADMINISTRATIVO

async function verificarAdmin() {

    const { data, error } =
        await supabaseClient.auth.getUser();

    if (
        error ||
        !data.user ||
        data.user.id !== UID_ADMIN
    ) {
        login.style.display = "block";
        painel.style.display = "none";
        return false;
    }

    login.style.display = "none";
    painel.style.display = "block";

    return true;
}


// FAZER LOGIN

async function fazerLogin() {

    const email =
        document.getElementById("email").value.trim();

    const senha =
        document.getElementById("senha").value;

    const mensagem =
        document.getElementById("mensagemLogin");

    if (!email || !senha) {
        mensagem.textContent =
            "Informe seu e-mail e sua senha.";
        return;
    }

    mensagem.textContent = "Verificando acesso...";

    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: senha
        });

    if (error) {
        mensagem.textContent =
            "E-mail ou senha incorretos.";
        return;
    }

    const autorizado = await verificarAdmin();

    if (!autorizado) {
        mensagem.textContent =
            "Acesso não autorizado.";
        return;
    }
}


// SAIR

async function sair() {

    await supabaseClient.auth.signOut();

    location.reload();
}


// ÁUDIO DE TIC-TAC

let contextoAudio = null;

function tocarTicTac() {

    if (!contextoAudio) return;

    const oscilador =
        contextoAudio.createOscillator();

    const volume =
        contextoAudio.createGain();

    oscilador.type = "sine";

    oscilador.frequency.value = 850;

    volume.gain.setValueAtTime(
        0.0001,
        contextoAudio.currentTime
    );

    volume.gain.exponentialRampToValueAtTime(
        0.12,
        contextoAudio.currentTime + 0.005
    );

    volume.gain.exponentialRampToValueAtTime(
        0.0001,
        contextoAudio.currentTime + 0.055
    );

    oscilador.connect(volume);

    volume.connect(contextoAudio.destination);

    oscilador.start();

    oscilador.stop(
        contextoAudio.currentTime + 0.06
    );
}


// APAGAR LUZES

function apagarLuzes() {

    document.querySelectorAll(".numero").forEach(
        elemento => {
            elemento.classList.remove(
                "aceso",
                "vencedor"
            );
        }
    );

}


// CONSULTAR O GANHADOR NO SUPABASE

async function consultarGanhador(numero) {

    const { data, error } =
        await supabaseClient.rpc(
            "buscar_ganhador_por_numero",
            {
                p_numero: numero
            }
        );

    if (error) {
        console.error(
            "Erro na consulta ao Supabase:",
            error
        );

        throw new Error(
            "Não foi possível consultar o Supabase."
        );
    }

    if (!data) {
        throw new Error(
            "O número sorteado não foi encontrado na tabela."
        );
    }

    return data;
}


// SORTEIO DE TESTE COM CONSULTA REAL

let testeEmAndamento = false;

async function iniciarTeste() {

    if (testeEmAndamento) return;

    testeEmAndamento = true;

    const botao =
        document.getElementById("iniciar");

    const texto =
        document.getElementById("textoResultado");

    const numeroFinal =
        document.getElementById("numeroFinal");

    const nomeVencedor =
        document.getElementById("nomeVencedor");

    const mensagem =
        document.getElementById("mensagemResultado");

    botao.disabled = true;

    botao.textContent = "SORTEANDO...";

    texto.textContent = "A SORTE ESTÁ LANÇADA!";

    numeroFinal.textContent = "--";

    nomeVencedor.textContent = "";

    mensagem.textContent = "";

    apagarLuzes();


    // INICIAR ÁUDIO

    try {

        if (!contextoAudio) {
            contextoAudio = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        await contextoAudio.resume();

    } catch (erro) {

        contextoAudio = null;

    }


    // ESCOLHER NÚMERO ENTRE 1 E 50

    const vencedor =
        Math.floor(Math.random() * 50) + 1;


    // ANIMAÇÃO DAS LUZES

    let anterior = 0;

    const totalEtapas = 65;

    for (let etapa = 0; etapa < totalEtapas; etapa++) {

        let intervalo;

        if (etapa < 35) {
            intervalo = 75;
        } else if (etapa < 50) {
            intervalo = 110;
        } else if (etapa < 60) {
            intervalo = 180;
        } else {
            intervalo = 300;
        }

        apagarLuzes();

        let atual;

        if (etapa === totalEtapas - 1) {

            atual = vencedor;

        } else {

            do {
                atual =
                    Math.floor(Math.random() * 50) + 1;
            } while (atual === anterior);

        }

        document
            .getElementById("numero-" + atual)
            .classList.add("aceso");

        anterior = atual;

        tocarTicTac();

        await new Promise(resolve =>
            setTimeout(resolve, intervalo)
        );

    }


    // DESTACAR O NÚMERO SORTEADO

    apagarLuzes();

    document
        .getElementById("numero-" + vencedor)
        .classList.add("vencedor");

    numeroFinal.textContent =
        String(vencedor).padStart(2, "0");

    texto.textContent =
        "CONSULTANDO O GANHADOR...";


    // CONSULTAR NOME NO SUPABASE

    try {

        const nome = await consultarGanhador(vencedor);

        texto.textContent =
            "NÚMERO SORTEADO!";

        nomeVencedor.textContent =
            nome;

        mensagem.textContent =
            "Ganhador identificado no Supabase.";

        botao.textContent =
            "TESTE CONCLUÍDO";

    } catch (erro) {

        console.error(erro);

        texto.textContent =
            "CONSULTA NÃO CONCLUÍDA";

        nomeVencedor.textContent = "";

        mensagem.textContent =
            erro.message;

        botao.textContent =
            "TENTAR NOVAMENTE";

    }

    testeEmAndamento = false;

    botao.disabled = false;

}


// VERIFICAR SESSÃO AO ABRIR A PÁGINA

verificarAdmin();

</script>

</body>
</html>
